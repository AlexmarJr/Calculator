name: calculator

services:
  backend:
    image: calculator-backend:local
    build:
      context: ./backend
    environment:
      PORT: "8080"
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8080}:8080"

  frontend:
    image: calculator-frontend:local
    build:
      context: ./frontend
      args:
        VITE_APP_ENV: "${APP_ENV:-local}"
    ports:
      - "127.0.0.1:${FRONTEND_PORT:-3000}:80"
    depends_on:
      - backend
